name: Deploy Upedia Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Linux Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            echo "Current path:"
            pwd

            echo "Pull latest code from GitHub..."
            git pull origin main

            echo "Run database migrations..."
            php artisan migrate --force
            
            echo "Run permission seeder..."
            php artisan db:seed --class=PermissionSeeder
            
            echo "Run role seeder..."
            php artisan db:seed --class=RolesSeeder
            
            echo "Run tabs seeder..."
            php artisan db:seed --class=TabSeeder

            echo "Clear Laravel cache..."
            php artisan optimize:clear

            echo "Fix Laravel permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "Deployment completed successfully."